services:
  db:
    image: postgres:15-alpine
    container_name: prueba_tecnica_db
    restart: always
    environment:
      POSTGRES_USER: user_app
      POSTGRES_PASSWORD: password_app
      POSTGRES_DB: db_prueba_tecnica
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  api:
    build: .
    container_name: prueba_tecnica_api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://user_app:password_app@db:5432/db_prueba_tecnica
    volumes:
      - ./app:/app/app
      - ./frontend:/app/frontend
      - ./main.py:/app/main.py
    depends_on:
      - db
    restart: always

volumes:
  postgres_data: